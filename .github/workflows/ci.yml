name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest


  build-and-push:
    needs: tests
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with: 
          context: .
          push: true
          tags: ghcr.io/raycharlesminkah34-creator/ckd-api:${{ github.sha }}

      - name: Generate tag
        id : image
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"


    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}


  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Check SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          echo "Key length: ${#SSH_KEY}"
          echo "First line: $(echo "$SSH_KEY" | head -n 1)"
          echo "Last line: $(echo "$SSH_KEY" | tail -n 1)"

      - name: Deployment Job
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.IP_ADDRESS }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            docker stop ckd-api-container || true
            docker rm ckd-api-container || true
            docker pull ghcr.io/raycharlesminkah34-creator/ckd-api:${{ needs.build-and-push.outputs.image_tag }}
            docker run -d -p 8000:8000 --name ckd-api-container ghcr.io/raycharlesminkah34-creator/ckd-api:${{ needs.build-and-push.outputs.image_tag }}



        

      