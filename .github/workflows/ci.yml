name: CI

on:
  push:
    branch: [main]
  pull-request:
    branch: [main]


job:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install depencies
        run: 
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      